<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Статья блога Фелиции о нумерологии, циклах и совместимости.">
  <link rel="icon" href="data:,">
  <title>Статья - Фелиция</title>
  <style>
    :root {
      --navy: #08131f;
      --sapphire: #123a63;
      --gold: #c99a3e;
      --cream: #faf7ef;
      --forest: #2f5e3e;
      --sky: #8ed8f8;
      --telegram-soft: #dce8f4;
      --telegram-line: #adc7dc;
      --ink: #10243c;
      --muted: #5c6a7b;
      --line: rgba(201, 154, 62, .34);
    }

    * {
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      margin: 0;
      padding-top: 78px;
      background:
        radial-gradient(circle at 4% 24%, rgba(142, 216, 248, .18), transparent 18%),
        radial-gradient(circle at 92% 72%, rgba(169, 199, 161, .18), transparent 24%),
        linear-gradient(180deg, #fffdf8 0%, #fbf5e8 48%, #eef8fb 100%);
      color: var(--ink);
      font-family: Inter, Arial, sans-serif;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    img {
      max-width: 100%;
    }

    .site-nav {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      z-index: 50;
      min-height: 78px;
      display: flex;
      align-items: center;
      background: linear-gradient(110deg, rgba(7, 20, 33, .97) 0%, rgba(16, 55, 93, .97) 56%, rgba(20, 63, 106, .97) 100%);
      box-shadow: 0 12px 30px rgba(8, 19, 31, .18);
      backdrop-filter: blur(14px);
    }

    .nav-inner {
      width: min(1180px, 100%);
      margin: 0 auto;
      padding: 10px 18px;
      display: grid;
      grid-template-columns: auto minmax(0, 1fr) auto auto;
      gap: 18px;
      align-items: center;
    }

    .nav-brand {
      color: #f7d98e;
      font-family: Georgia, "Times New Roman", serif;
      font-size: 31px;
      font-weight: 700;
      line-height: 1;
      white-space: nowrap;
      display: grid;
      gap: 2px;
    }

    .nav-brand small {
      color: #f3d58f;
      font-size: 15px;
      font-weight: 600;
      line-height: 1;
    }

    .nav-links,
    .lang-switch {
      display: flex;
      align-items: center;
    }

    .nav-links {
      justify-content: center;
      gap: 8px;
    }

    .lang-switch {
      gap: 4px;
    }

    .nav-links a,
    .lang-button {
      min-height: 38px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      border: 1px solid transparent;
      border-radius: 999px;
      background: transparent;
      color: rgba(255, 255, 255, .84);
      font: inherit;
      font-size: 14px;
      font-weight: 850;
      line-height: 1;
      cursor: pointer;
    }

    .nav-links a {
      padding: 0 14px;
    }

    .lang-button {
      width: 40px;
      color: rgba(255, 255, 255, .78);
    }

    .lang-button.active {
      border-color: rgba(201, 154, 62, .72);
      color: #f7d98e;
    }

    .nav-cta,
    .button {
      min-height: 48px;
      padding: 14px 22px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      border: 2px solid var(--gold);
      border-radius: 999px;
      background: var(--forest);
      color: #fff;
      font-size: 15px;
      font-weight: 950;
      letter-spacing: .04em;
      text-transform: uppercase;
    }

    .button.telegram {
      border-color: var(--telegram-line);
      background: var(--telegram-soft);
      color: var(--sapphire);
      box-shadow: 0 10px 24px rgba(56, 166, 225, .2);
    }

    .button.secondary {
      background: rgba(255, 253, 248, .92);
      color: var(--sapphire);
    }

    .article-shell {
      width: min(980px, 100%);
      margin: 0 auto;
      padding: 56px 18px 94px;
    }

    .back-link {
      min-height: 42px;
      padding: 10px 16px;
      display: inline-flex;
      align-items: center;
      border: 1px solid var(--line);
      border-radius: 999px;
      background: rgba(255, 253, 248, .82);
      color: var(--sapphire);
      font-size: 14px;
      font-weight: 900;
    }

    .article-card {
      margin-top: 22px;
      border: 1px solid var(--line);
      border-radius: 18px;
      overflow: hidden;
      background: rgba(255, 253, 248, .82);
      box-shadow: 0 18px 48px rgba(8, 19, 31, .1);
    }

    .article-image {
      width: 100%;
      height: min(520px, 54vw);
      min-height: 260px;
      display: block;
      object-fit: cover;
      background: #fff;
    }

    .article-body {
      padding: clamp(24px, 5vw, 52px);
    }

    .article-meta {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-bottom: 18px;
      color: var(--gold);
      font-size: 14px;
      font-weight: 950;
      letter-spacing: .08em;
      text-transform: uppercase;
    }

    h1 {
      margin: 0;
      color: var(--sapphire);
      font-family: Georgia, "Times New Roman", serif;
      font-size: clamp(38px, 6vw, 70px);
      line-height: 1.02;
    }

    .lead {
      margin: 22px 0 0;
      color: var(--muted);
      font-size: clamp(20px, 2.5vw, 25px);
      font-weight: 750;
      line-height: 1.35;
    }

    .article-content {
      margin-top: 34px;
      display: grid;
      gap: 20px;
    }

    .article-content p {
      margin: 0;
      color: var(--ink);
      font-size: clamp(18px, 2vw, 21px);
      font-weight: 600;
      line-height: 1.58;
    }

    .article-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      margin-top: 34px;
    }

    .empty {
      padding: 42px;
      text-align: center;
    }

    .empty h1 {
      font-size: clamp(34px, 5vw, 54px);
    }

    .float-button {
      position: fixed;
      z-index: 60;
      width: 54px;
      height: 54px;
      display: grid;
      place-items: center;
      border: 2px solid var(--gold);
      border-radius: 50%;
      background: var(--forest);
      color: #fff;
      font-size: 18px;
      font-weight: 950;
      box-shadow: 0 14px 30px rgba(8, 19, 31, .24);
    }

    .whatsapp-float {
      left: 18px;
      bottom: 22px;
      background: #1fa855;
    }

    .to-top {
      right: 18px;
      bottom: 22px;
    }

    @media (max-width: 820px) {
      body {
        padding-top: 96px;
      }

      .site-nav {
        min-height: 96px;
      }

      .nav-inner {
        grid-template-columns: minmax(0, 1fr) auto;
        gap: 8px 12px;
      }

      .nav-links {
        order: 3;
        grid-column: 1 / -1;
        justify-content: start;
        overflow-x: auto;
      }

      .nav-links a {
        white-space: nowrap;
      }

      .nav-cta {
        display: none;
      }
    }

    @media (max-width: 560px) {
      body {
        padding-top: 116px;
      }

      .site-nav {
        min-height: 116px;
      }

      .nav-brand {
        font-size: 25px;
      }

      .nav-brand small {
        font-size: 13px;
      }

      .nav-inner {
        display: flex;
        flex-wrap: wrap;
        padding: 10px 18px 12px;
      }

      .lang-switch {
        margin-left: auto;
      }

      .lang-button {
        width: 30px;
        min-height: 30px;
        font-size: 11px;
      }

      .nav-links {
        width: 100%;
        margin-top: 4px;
        justify-content: space-between;
        gap: 2px;
        overflow-x: visible;
      }

      .nav-links a {
        min-height: 30px;
        padding: 6px 4px;
        font-size: 12px;
      }

      .article-shell {
        padding-top: 34px;
      }

      .empty {
        padding: 24px;
      }

      .article-body {
        padding: 24px 48px 42px;
      }

      .float-button {
        width: 44px;
        height: 44px;
        font-size: 15px;
      }

      .whatsapp-float {
        left: 10px;
        bottom: 12px;
      }

      .to-top {
        right: 10px;
        bottom: 12px;
      }

      .article-actions .button {
        width: 100%;
      }
    }
  </style>
</head>
<body id="top">
  <nav class="site-nav" aria-label="Навигация сайта">
    <div class="nav-inner">
      <a class="nav-brand" href="index.html#top"><span data-ui="brandName">Фелиция</span><small>14 / 41</small></a>
      <div class="nav-links">
        <a data-link="package" href="index.html#package" data-ui="navPackage">Пакет</a>
        <a data-link="catalog" href="index.html#catalog" data-ui="navCatalog">Каталог</a>
        <a data-link="visuals" href="index.html#visuals" data-ui="navVisuals">Визуальные материалы</a>
        <a data-link="blog" href="index.html#blog" data-ui="navBlog">Блог</a>
      </div>
      <div class="lang-switch" aria-label="Выбор языка">
        <button class="lang-button active" type="button" data-lang="ru">RU</button>
        <button class="lang-button" type="button" data-lang="ro">RO</button>
        <button class="lang-button" type="button" data-lang="en">EN</button>
      </div>
      <a class="nav-cta" href="https://wa.me/37377808128" target="_blank" rel="noreferrer">WhatsApp</a>
    </div>
  </nav>

  <main class="article-shell">
    <a class="back-link" id="back-link" href="index.html#blog" data-ui="backToBlog">Назад в блог</a>
    <article class="article-card" id="article"></article>
  </main>

  <a class="float-button whatsapp-float" href="https://wa.me/37377808128" target="_blank" rel="noreferrer" aria-label="WhatsApp">WA</a>
  <a class="float-button to-top" href="#top" aria-label="Наверх">↑</a>

  <script src="scripts/blog-data.js"></script>
  <script>
    const storageKey = "felitziaBlogPosts";
    const supportedLanguages = ["ru", "ro", "en"];
    const params = new URLSearchParams(window.location.search);
    let currentLang = supportedLanguages.includes(params.get("lang"))
      ? params.get("lang")
      : (supportedLanguages.includes(localStorage.getItem("felitziaLang")) ? localStorage.getItem("felitziaLang") : "ru");
    const articleId = params.get("id") || "";

    const ui = {
      ru: {
        brandName: "Фелиция",
        pageTitle: "Статья - Фелиция",
        navPackage: "Пакет",
        navCatalog: "Каталог",
        navVisuals: "Визуальные материалы",
        navBlog: "Блог",
        backToBlog: "Назад в блог",
        writeTelegram: "Написать в Telegram",
        watchCatalog: "Смотреть каталог",
        notFoundTitle: "Статья не найдена",
        notFoundText: "Откройте блог и выберите нужную статью."
      },
      ro: {
        brandName: "Felitzia",
        pageTitle: "Articol - Felitzia",
        navPackage: "Pachet",
        navCatalog: "Catalog",
        navVisuals: "Materiale vizuale",
        navBlog: "Blog",
        backToBlog: "Inapoi la blog",
        writeTelegram: "Scrie pe Telegram",
        watchCatalog: "Vezi catalogul",
        notFoundTitle: "Articolul nu a fost gasit",
        notFoundText: "Deschide blogul si alege articolul necesar."
      },
      en: {
        brandName: "Felitzia",
        pageTitle: "Article - Felitzia",
        navPackage: "Package",
        navCatalog: "Catalog",
        navVisuals: "Visual materials",
        navBlog: "Blog",
        backToBlog: "Back to blog",
        writeTelegram: "Write on Telegram",
        watchCatalog: "View catalog",
        notFoundTitle: "Article not found",
        notFoundText: "Open the blog and choose the article you need."
      }
    };

    function localize(value) {
      if (typeof value === "string") return value;
      return value && (value[currentLang] || value.ru || value.ro || value.en) || "";
    }

    function escapeHtml(value) {
      return String(value)
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;");
    }

    function readClientPosts() {
      try {
        const posts = JSON.parse(localStorage.getItem(storageKey) || "[]");
        return Array.isArray(posts) ? posts : [];
      } catch {
        return [];
      }
    }

    function normalizePost(post) {
      return {
        id: post.id || "",
        date: post.date || "2026-09-06",
        category: post.category || { ru: "Новость", ro: "Noutate", en: "News" },
        image: post.image || "assets/home-main-visual.png",
        title: post.title || { ru: "Новая запись", ro: "Postare noua", en: "New post" },
        text: post.text || { ru: "", ro: "", en: "" },
        content: post.content || null,
        lang: post.lang || "all"
      };
    }

    function allPosts() {
      const clientPosts = readClientPosts().map(normalizePost);
      const defaultPosts = Array.isArray(window.felitziaDefaultPosts) ? window.felitziaDefaultPosts.map(normalizePost) : [];
      return [...clientPosts, ...defaultPosts];
    }

    function articleParagraphs(post) {
      const content = localize(post.content);
      if (Array.isArray(content) && content.length) return content;
      const text = localize(post.text);
      return String(text).split(/\n{2,}|\n/).map((line) => line.trim()).filter(Boolean);
    }

    function updateLanguageLinks() {
      localStorage.setItem("felitziaLang", currentLang);
      document.documentElement.lang = currentLang;
      document.querySelectorAll("[data-ui]").forEach((node) => {
        const key = node.dataset.ui;
        if (ui[currentLang][key]) node.innerHTML = ui[currentLang][key];
      });
      document.querySelectorAll(".lang-button").forEach((button) => {
        button.classList.toggle("active", button.dataset.lang === currentLang);
      });
      document.querySelectorAll("[data-link]").forEach((link) => {
        link.href = `index.html?lang=${encodeURIComponent(currentLang)}#${link.dataset.link}`;
      });
      document.querySelector(".nav-brand").href = `index.html?lang=${encodeURIComponent(currentLang)}#top`;
      document.getElementById("back-link").href = `index.html?lang=${encodeURIComponent(currentLang)}#blog`;
    }

    function renderArticle() {
      updateLanguageLinks();
      const holder = document.getElementById("article");
      const post = allPosts().find((entry) => entry.id === articleId && (entry.lang === "all" || entry.lang === currentLang));
      if (!post) {
        document.title = ui[currentLang].pageTitle;
        holder.innerHTML = `
          <div class="empty">
            <h1>${escapeHtml(ui[currentLang].notFoundTitle)}</h1>
            <p class="lead">${escapeHtml(ui[currentLang].notFoundText)}</p>
            <div class="article-actions">
              <a class="button secondary" href="index.html?lang=${escapeHtml(currentLang)}#blog">${escapeHtml(ui[currentLang].backToBlog)}</a>
            </div>
          </div>
        `;
        return;
      }

      const title = localize(post.title);
      document.title = `${title} - ${ui[currentLang].brandName}`;
      holder.innerHTML = `
        <img class="article-image" src="${escapeHtml(post.image)}" alt="${escapeHtml(title)}">
        <div class="article-body">
          <div class="article-meta"><span>${escapeHtml(post.date)}</span><span>${escapeHtml(localize(post.category))}</span></div>
          <h1>${escapeHtml(title)}</h1>
          <p class="lead">${escapeHtml(localize(post.text))}</p>
          <div class="article-content">
            ${articleParagraphs(post).map((paragraph) => `<p>${escapeHtml(paragraph)}</p>`).join("")}
          </div>
          <div class="article-actions">
            <a class="button telegram" href="https://t.me/Inna1661" target="_blank" rel="noreferrer">${escapeHtml(ui[currentLang].writeTelegram)}</a>
            <a class="button secondary" href="index.html?lang=${escapeHtml(currentLang)}#catalog">${escapeHtml(ui[currentLang].watchCatalog)}</a>
          </div>
        </div>
      `;
    }

    document.querySelectorAll(".lang-button").forEach((button) => {
      button.addEventListener("click", () => {
        currentLang = supportedLanguages.includes(button.dataset.lang) ? button.dataset.lang : "ru";
        params.set("lang", currentLang);
        if (articleId) params.set("id", articleId);
        window.history.replaceState(null, "", `article.html?${params.toString()}`);
        renderArticle();
      });
    });

    renderArticle();
  </script>
</body>
</html>
