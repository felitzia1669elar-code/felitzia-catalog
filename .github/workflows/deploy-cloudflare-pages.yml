name: Validate Felitzia site

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check JavaScript syntax
        run: |
          node --check functions/_middleware.js
          node --check scripts/scroll-scene.js
          node --check scripts/generate-seo.mjs
      - name: Check SEO routes and article assets
        run: node scripts/test-seo.mjs
      - name: Check generated home content
        run: |
          node scripts/extract-home-content.mjs
          git diff --exit-code -- home-content.json dist/home-content.json
